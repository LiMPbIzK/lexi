<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo con gradiente y cuadrícula -->
  <rect width="800" height="200" rx="16" fill="url(#bg)" />
  <path d="M 0 50 L 800 50 M 0 100 L 800 100 M 0 150 L 800 150 M 100 0 L 100 200 M 200 0 L 200 200 M 300 0 L 300 200 M 400 0 L 400 200 M 500 0 L 500 200 M 600 0 L 600 200 M 700 0 L 700 200" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.3"/>

  <!-- Isotipo: Tira de frase (Sentence Strip) - Centrado Absoluto -->
  <g transform="translate(299, 35)">
    <!-- Nodos (Pictogramas según Clave Fitzgerald) -->
    <rect x="0" y="0" width="40" height="40" rx="10" fill="#fde047" />   <!-- Sujeto -->
    <rect x="54" y="0" width="40" height="40" rx="10" fill="#4ade80" />  <!-- Verbo -->
    <rect x="108" y="0" width="40" height="40" rx="10" fill="#fb923c" /> <!-- Nombre -->
    <rect x="162" y="0" width="40" height="40" rx="10" fill="#60a5fa" /> <!-- Adjetivo -->
    
    <!-- Líneas de concatenación -->
    <path d="M 40 20 L 54 20 M 94 20 L 108 20 M 148 20 L 162 20" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Tipografía centrada -->
  <text x="400" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#f8fafc" letter-spacing="-1" text-anchor="middle">LeXi</text>
  <text x="400" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#60a5fa" letter-spacing="4" text-anchor="middle">AAC WEB COMMUNICATOR</text>
</svg>
