name: Seed ARASAAC + validate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  seed-check:
    name: Seed ARASAAC (check + generate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm install --no-fund --no-audit --loglevel=error

      - name: Seed check
        id: seed
        run: |
          node scripts/seed-arasaac.mjs --check
          exit_code=$?
          echo "changed=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Seed full (download + generate)
        if: steps.seed.outputs.changed == '1'
        run: |
          node scripts/seed-arasaac.mjs --download
          echo "::warning::El vocabulario ARASAAC cambió. El manifest y SQL generados en CI pueden no coincidir con los commiteados. Revisa que el manifest/SQL regenerados se commiteen."

      - name: Build
        run: npm run build
